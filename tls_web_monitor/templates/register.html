{% extends "base.html" %}

{% block title %}User Registration - {{ app_name }}{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">👤</div>
            <h1>Create New Account</h1>
            <p>Role: Standard User (RBAC Restricted)</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="form-input" 
                    placeholder="e.g. jdoe_analyst" 
                    required 
                    autocomplete="username"
                    autofocus
                >
                <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem;">3-30 chars, letters, numbers, underscores or hyphens.</div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-input" 
                    placeholder="Min 8 characters, letters & digits" 
                    required 
                    autocomplete="new-password"
                >
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input 
                    type="password" 
                    id="confirm_password" 
                    name="confirm_password" 
                    class="form-input" 
                    placeholder="Repeat password" 
                    required 
                    autocomplete="new-password"
                >
            </div>

            <div style="margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem;">
                    Register Secure Account ➔
                </button>
            </div>
        </form>

        <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border-color); text-align: center; font-size: 0.85rem; color: var(--text-secondary);">
            Already registered? <a href="{{ url_for('auth.login') }}" style="color: var(--accent-cyan); text-decoration: none; font-weight: 600;">Back to Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
